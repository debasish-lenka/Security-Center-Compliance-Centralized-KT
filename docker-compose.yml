name: dbi-security   # own project/network name, so it never clashes with other compose stacks

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dbi_security
    volumes:
      - dbi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbi -d dbi_security"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no published ports: only reachable from inside this stack

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://dbi:${POSTGRES_PASSWORD}@db:5432/dbi_security?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost:8443}
      FRONTEND_URL: ${CORS_ORIGIN:-https://localhost:8443}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      STORAGE_DIR: /data/Documents
      BACKUP_DIR: /data/backups
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@123}
    volumes:
      - ./Documents:/data/Documents   # uploaded files appear in <project>/Documents on the host
      - ./backups:/data/backups       # backups made from the Backups page (and ./backup.sh) appear in <project>/backups
    # no published ports: web proxies /api to it

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST (server IP or name) in .env}
    volumes:
      - dbi_certs:/etc/nginx/certs    # self-signed HTTPS certificate survives rebuilds
    ports:
      - "${WEB_PORT:-8443}:443"       # the only port opened on the host (HTTPS)

volumes:
  dbi_pgdata:
  dbi_certs:
